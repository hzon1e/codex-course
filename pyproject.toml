[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greeting-app"
version = "0.1.0"
description = "A small project for learning software engineering with Codex."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]